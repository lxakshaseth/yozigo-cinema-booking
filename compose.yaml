services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yozigo
      POSTGRES_PASSWORD: yozigo_local
      POSTGRES_DB: yozigo
    ports: ["127.0.0.1:5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yozigo -d yozigo"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
